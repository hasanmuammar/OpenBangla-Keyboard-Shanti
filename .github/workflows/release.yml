name: Linux release

on:
  push:
    tags:
      - "shanti-alpha.*"

permissions:
  contents: read

jobs:
  build-flatpak:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Flatpak build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak flatpak-builder appstream appstream-compose

      - name: Configure Flathub remote
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build Flatpak bundle
        env:
          FLATPAK_ARCH: ${{ matrix.arch }}
          # Use the distro AppStream tools: a Homebrew appstream on PATH may
          # lack the appstream-compose helper flatpak-builder needs to finish.
          PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          flatpak-builder --disable-rofiles-fuse --force-clean --user \
            --default-branch=stable \
            --install-deps-from=flathub \
            --repo=flatpak-repo \
            build-dir tools/flatpak/shanti-ibus.yml
          flatpak build-bundle --arch="$FLATPAK_ARCH" \
            flatpak-repo "shanti-ibus-${FLATPAK_ARCH}.flatpak" \
            org.shanti.ShantiIbus stable
          sha256sum "shanti-ibus-${FLATPAK_ARCH}.flatpak" \
            > "shanti-ibus-${FLATPAK_ARCH}.flatpak.sha256"

      - name: Attest Flatpak bundle and checksum
        uses: actions/attest@v4
        with:
          subject-path: |
            shanti-ibus-${{ matrix.arch }}.flatpak
            shanti-ibus-${{ matrix.arch }}.flatpak.sha256

      - name: Upload Flatpak release assets
        uses: actions/upload-artifact@v5
        with:
          name: flatpak-${{ matrix.arch }}
          path: |
            shanti-ibus-${{ matrix.arch }}.flatpak
            shanti-ibus-${{ matrix.arch }}.flatpak.sha256
          if-no-files-found: error

  build-flatpak-fcitx:
    # Self-contained Fcitx5 app (org.shanti.ShantiFcitx5): Flathub's
    # published org.fcitx.Fcitx5 app is the manifest base, so one bundle
    # carries the whole sandboxed Fcitx5 stack plus the Shanti engine.
    # See tools/flatpak/fcitx-app.yml.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Flatpak build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak flatpak-builder appstream appstream-compose

      - name: Configure Flathub remote
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build Flatpak bundle
        env:
          FLATPAK_ARCH: ${{ matrix.arch }}
          # Use the distro AppStream tools: a Homebrew appstream on PATH may
          # lack the appstream-compose helper flatpak-builder needs to finish.
          PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          flatpak-builder --disable-rofiles-fuse --force-clean --user \
            --default-branch=stable \
            --install-deps-from=flathub \
            --repo=flatpak-repo-fcitx \
            build-dir-fcitx tools/flatpak/fcitx-app.yml
          flatpak build-bundle --arch="$FLATPAK_ARCH" \
            flatpak-repo-fcitx "shanti-fcitx5-${FLATPAK_ARCH}.flatpak" \
            org.shanti.ShantiFcitx5 stable
          sha256sum "shanti-fcitx5-${FLATPAK_ARCH}.flatpak" \
            > "shanti-fcitx5-${FLATPAK_ARCH}.flatpak.sha256"

      - name: Attest Fcitx app bundle and checksum
        uses: actions/attest@v4
        with:
          subject-path: |
            shanti-fcitx5-${{ matrix.arch }}.flatpak
            shanti-fcitx5-${{ matrix.arch }}.flatpak.sha256

      - name: Upload Fcitx app release assets
        uses: actions/upload-artifact@v5
        with:
          name: flatpak-fcitx-${{ matrix.arch }}
          path: |
            shanti-fcitx5-${{ matrix.arch }}.flatpak
            shanti-fcitx5-${{ matrix.arch }}.flatpak.sha256
          if-no-files-found: error

  release:
    needs: [build-flatpak, build-flatpak-fcitx]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Shanti Keyboard ${GITHUB_REF_NAME}" \
            --prerelease \
            --notes-file .github/release-notes.md

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release/*
