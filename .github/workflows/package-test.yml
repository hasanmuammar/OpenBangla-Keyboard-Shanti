name: Prebuilt package test

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]
  workflow_dispatch:

jobs:
  package-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            backend: ibus
          - runner: ubuntu-24.04
            arch: x86_64
            backend: fcitx
          - runner: ubuntu-24.04-arm
            arch: aarch64
            backend: ibus
          - runner: ubuntu-24.04-arm
            arch: aarch64
            backend: fcitx

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y             build-essential             cmake             ninja-build             pkg-config             rustc             cargo             libzstd-dev             qtbase5-dev             qtbase5-dev-tools             libqt5svg5-dev             libibus-1.0-dev             libfcitx5core-dev             ca-certificates

      - name: Check shell syntax
        run: |
          bash -n tools/portable/common.sh
          bash -n tools/portable/build.sh
          bash -n tools/portable/bundle-runtime.sh
          bash -n tools/portable/environment.sh
          bash -n tools/portable/install.sh
          bash -n tools/portable/package.sh
          bash -n tools/install.sh
          bash -n tools/uninstall.sh

      - name: Verify release integrity helpers
        run: |
          set -Eeuo pipefail
          test_root="$(mktemp -d)"
          mkdir -p "$test_root/payload/bin" "$test_root/payload/lib/openbangla" "$test_root/payload/share/openbangla-keyboard"
          printf '%s\n' 'gui fixture' > "$test_root/payload/bin/openbangla-gui"
          printf '%s\n' 'runtime fixture' > "$test_root/payload/lib/openbangla/runtime.so"
          printf '%s\n' 'data fixture' > "$test_root/payload/share/openbangla-keyboard/data.json"
          chmod +x "$test_root/payload/bin/openbangla-gui"
          tar -czf "$test_root/good.tar.gz" -C "$test_root/payload" .
          (cd "$test_root" && sha256sum good.tar.gz > good.tar.gz.sha256)

          INSTALL_TEST_ROOT="$test_root" bash -c '
            set -Eeuo pipefail
            source tools/install.sh
            validate_release_checksum "$INSTALL_TEST_ROOT/good.tar.gz" "$INSTALL_TEST_ROOT/good.tar.gz.sha256" good.tar.gz
            validate_release_archive_paths "$INSTALL_TEST_ROOT/good.tar.gz" "$INSTALL_TEST_ROOT/good.list"
            mkdir -p "$INSTALL_TEST_ROOT/extracted/lib"
            printf "%s\\n" fixture > "$INSTALL_TEST_ROOT/extracted/lib/library.so"
            ln -s library.so "$INSTALL_TEST_ROOT/extracted/lib/local-link.so"
            validate_extracted_symlinks "$INSTALL_TEST_ROOT/extracted"
          '

          digest="$(sha256sum "$test_root/good.tar.gz")"
          digest="${digest%% *}"
          printf '%s  wrong-name.tar.gz\n' "$digest" > "$test_root/wrong-name.sha256"
          if INSTALL_TEST_ROOT="$test_root" bash -c 'source tools/install.sh; validate_release_checksum "$INSTALL_TEST_ROOT/good.tar.gz" "$INSTALL_TEST_ROOT/wrong-name.sha256" good.tar.gz'; then
            echo "Checksum validator accepted a checksum for a different filename." >&2
            exit 1
          fi

          python3 - "$test_root/unsafe.tar.gz" <<'PY'
          import io
          import sys
          import tarfile
          with tarfile.open(sys.argv[1], "w:gz") as archive:
              info = tarfile.TarInfo("../escape.txt")
              payload = b"must not be extracted"
              info.size = len(payload)
              archive.addfile(info, io.BytesIO(payload))
          PY
          if INSTALL_TEST_ROOT="$test_root" bash -c 'source tools/install.sh; validate_release_archive_paths "$INSTALL_TEST_ROOT/unsafe.tar.gz" "$INSTALL_TEST_ROOT/unsafe.list"'; then
            echo "Archive validator accepted a path traversal entry." >&2
            exit 1
          fi

          python3 - "$test_root/symlink-parent.tar.gz" <<'PY'
          import io
          import sys
          import tarfile
          with tarfile.open(sys.argv[1], "w:gz") as archive:
              link = tarfile.TarInfo("lib/link")
              link.type = tarfile.SYMTYPE
              link.linkname = "openbangla"
              archive.addfile(link)
              info = tarfile.TarInfo("lib/link/payload.bin")
              payload = b"must not be extracted through a symlink"
              info.size = len(payload)
              archive.addfile(info, io.BytesIO(payload))
          PY
          if INSTALL_TEST_ROOT="$test_root" bash -c 'source tools/install.sh; validate_release_archive_paths "$INSTALL_TEST_ROOT/symlink-parent.tar.gz" "$INSTALL_TEST_ROOT/symlink-parent.list"'; then
            echo "Archive validator accepted a member nested under a symbolic link." >&2
            exit 1
          fi

          python3 - "$test_root/symlink-parent.tar.gz" <<'PY'
          import io
          import sys
          import tarfile
          with tarfile.open(sys.argv[1], "w:gz") as archive:
              link = tarfile.TarInfo("lib/link")
              link.type = tarfile.SYMTYPE
              link.linkname = "openbangla"
              archive.addfile(link)
              info = tarfile.TarInfo("lib/link/payload.bin")
              payload = b"must not be extracted through a symlink"
              info.size = len(payload)
              archive.addfile(info, io.BytesIO(payload))
          PY
          if INSTALL_TEST_ROOT="$test_root" bash -c 'source tools/install.sh; validate_release_archive_paths "$INSTALL_TEST_ROOT/symlink-parent.tar.gz" "$INSTALL_TEST_ROOT/symlink-parent.list"'; then
            echo "Archive validator accepted a member nested under a symbolic link." >&2
            exit 1
          fi

          ln -s /etc/passwd "$test_root/extracted/lib/escape-link.so"
          if INSTALL_TEST_ROOT="$test_root" bash -c 'source tools/install.sh; validate_extracted_symlinks "$INSTALL_TEST_ROOT/extracted"'; then
            echo "Symlink validator accepted a link outside the extraction root." >&2
            exit 1
          fi
          echo "Release checksum, archive-path, and symlink-containment tests passed."

      - name: Build prebuilt package
        env:
          OPENBANGLA_BUILD_USE_HOST: "1"
          OPENBANGLA_NONINTERACTIVE: "1"
        run: bash tools/build.sh --backend ${{ matrix.backend }} --package

      - name: Validate package
        env:
          BACKEND: ${{ matrix.backend }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -Eeuo pipefail

          archive="dist/openbangla-keyboard_linux_${ARCH}_${BACKEND}.tar.gz"
          checksum="${archive}.sha256"

          test -f "$archive"
          test -f "$checksum"
          (
            cd dist
            sha256sum -c "$(basename "$checksum")"
          )

          work="$(mktemp -d)"
          install_home="$(mktemp -d)"
          # GitHub-hosted runners are disposable; leave these temporary paths
          # for runner teardown rather than issuing an automatic recursive delete.
          source tools/install.sh
          validate_release_archive_paths "$archive" "$work/archive-listing.txt"
          tar --no-same-owner --no-same-permissions -xzf "$archive" -C "$work"
          validate_extracted_symlinks "$work"

          test -x "$work/bin/openbangla-gui"
          test -f "$work/share/applications/openbangla-keyboard.desktop"
          grep -Fq 'Exec="@OBK_PREFIX@/bin/openbangla-gui" %f' "$work/share/applications/openbangla-keyboard.desktop"
          ! grep -Fq '/home/runner/' "$work/share/applications/openbangla-keyboard.desktop"
          test -d "$work/lib/openbangla"
          test -d "$work/share/openbangla-keyboard"
          test -f "$work/share/openbangla-keyboard/layouts/avrophonetic.json"
          test -f "$work/share/openbangla-keyboard/data/autocorrect.json"
          test -f "$work/share/openbangla-keyboard/data/dictionary.json"
          test -f "$work/share/openbangla-keyboard/data/suffix.json"
          test -f "$work/share/openbangla-keyboard/data/regex.json"

          # The archive must carry the user-facing scripts with their layout and
          # release tag intact, so a download alone can install or uninstall.
          test -f "$work/share/openbangla-keyboard/tools/install.sh"
          test -x "$work/share/openbangla-keyboard/tools/install.sh"
          test -f "$work/share/openbangla-keyboard/tools/uninstall.sh"
          test -x "$work/share/openbangla-keyboard/tools/uninstall.sh"
          test -f "$work/share/openbangla-keyboard/tools/portable/common.sh"
          test -f "$work/share/openbangla-keyboard/tools/portable/install.sh"
          test -f "$work/share/openbangla-keyboard/tools/portable/launch-bundled.sh"
          test -f "$work/share/openbangla-keyboard/release-tag.txt"
          bash -n "$work/share/openbangla-keyboard/tools/install.sh"
          bash -n "$work/share/openbangla-keyboard/tools/uninstall.sh"

          if [[ "$BACKEND" == ibus ]]; then
            test -x "$work/libexec/ibus-engine-openbangla"
            test -f "$work/share/ibus/component/openbangla.xml"
            grep -Fq '<exec>@OBK_PREFIX@/libexec/ibus-engine-openbangla --ibus</exec>' "$work/share/ibus/component/openbangla.xml"
            grep -Fq '<icon>@OBK_DATA_HOME@/openbangla-keyboard/icons/OpenBangla-Keyboard.png</icon>' "$work/share/ibus/component/openbangla.xml"
            ! grep -Fq '/home/runner/' "$work/share/ibus/component/openbangla.xml"
          else
            test -f "$work/share/fcitx5/addon/openbangla.conf"
          fi

          XDG_DATA_HOME="$work/share" XDG_CONFIG_HOME="$work/check-config" XDG_CACHE_HOME="$work/check-cache" QT_QPA_PLATFORM=offscreen "$work/bin/openbangla-gui" --version
          XDG_DATA_HOME="$work/share" XDG_CONFIG_HOME="$work/check-config" XDG_CACHE_HOME="$work/check-cache" QT_QPA_PLATFORM=offscreen "$work/bin/openbangla-gui" --check-data

          # Simulate installation with a non-default absolute XDG_DATA_HOME.
          install_prefix="$install_home/.local"
          install_stage="$install_home/stage"
          staged_root="$install_stage$install_prefix"
          install_data_home="$work/custom-xdg-data"
          install_config_home="$work/custom-xdg-config"
          mkdir -p "$staged_root" "$install_prefix" "$install_data_home" "$install_config_home"
          tar -xzf "$archive" -C "$staged_root"
          for item in bin lib libexec; do
            if [[ -e "$staged_root/$item" ]]; then
              cp -a "$staged_root/$item" "$install_prefix/"
            fi
          done

          HOME="$install_home" \
          XDG_DATA_HOME="$install_data_home" \
          XDG_CONFIG_HOME="$install_config_home" \
          OBK_PREFIX="$install_prefix" \
          OBK_STAGE="$install_stage" \
          OBK_DATA_HOME="$install_data_home" \
          OBK_BACKEND="$BACKEND" \
          bash -c '
            set -Eeuo pipefail
            source tools/portable/common.sh
            source tools/portable/install.sh
            install_xdg_resources "$OBK_STAGE$OBK_PREFIX/share"
            rewrite_install_metadata

            test -f "$OBK_DATA_HOME/openbangla-keyboard/data/dictionary.json"
            # The bundled scripts travel with the relocated data directory.
            test -f "$OBK_DATA_HOME/openbangla-keyboard/tools/install.sh"
            test -f "$OBK_DATA_HOME/openbangla-keyboard/tools/uninstall.sh"
            test -f "$OBK_DATA_HOME/openbangla-keyboard/release-tag.txt"
            # Custom XDG_DATA_HOME must receive resources without a shadowing
            # copy left under the install prefix.
            test ! -e "$OBK_PREFIX/share/openbangla-keyboard"
            test -f "$OBK_DATA_HOME/applications/openbangla-keyboard.desktop"
            grep -Fq "Exec=\"$OBK_PREFIX/bin/openbangla-gui\" %f" \
              "$OBK_DATA_HOME/applications/openbangla-keyboard.desktop"

            QT_QPA_PLATFORM=offscreen "$OBK_PREFIX/bin/openbangla-gui" --check-data

            if [[ "$OBK_BACKEND" == ibus ]]; then
              grep -Fq "<exec>\"$OBK_PREFIX/libexec/ibus-engine-openbangla\" --ibus</exec>" \
                "$OBK_DATA_HOME/ibus/component/openbangla.xml"
              grep -Fq "<icon>$OBK_DATA_HOME/openbangla-keyboard/icons/OpenBangla-Keyboard.png</icon>" \
                "$OBK_DATA_HOME/ibus/component/openbangla.xml"
            else
              test -f "$OBK_DATA_HOME/fcitx5/addon/openbangla.conf"
              test -f "$OBK_DATA_HOME/fcitx5/inputmethod/openbangla.conf"
            fi

            # Regression test: merge collisions must not delete skipped user data.
            migration_prefix="$HOME/migration/.local"
            migration_data="$HOME/migration/xdg"
            legacy_data="$migration_prefix/share/openbangla-keyboard"
            target_data="$migration_data/openbangla-keyboard"
            mkdir -p "$legacy_data/layouts" "$legacy_data/data" \
              "$target_data/layouts" "$target_data/data"
            printf "%s\n" "legacy custom layout" > "$legacy_data/layouts/custom.json"
            printf "%s\n" "destination custom layout" > "$target_data/layouts/custom.json"
            printf "%s\n" "legacy autocorrect" > "$legacy_data/data/autocorrect.json"
            printf "%s\n" "destination autocorrect" > "$target_data/data/autocorrect.json"

            OBK_PREFIX="$migration_prefix"
            OBK_DATA_HOME="$migration_data"
            migrate_legacy_xdg_resources

            test -f "$legacy_data/layouts/custom.json"
            test -f "$legacy_data/data/autocorrect.json"
            test "$(cat "$target_data/layouts/custom.json")" = "destination custom layout"
            test "$(cat "$target_data/data/autocorrect.json")" = "destination autocorrect"
            test -f "$migration_data/.openbangla-keyboard-xdg-migration-v1-complete"

            # A subsequent run must not re-import stale legacy files.
            printf "%s\n" "new destination layout" > "$target_data/layouts/custom.json"
            migrate_legacy_xdg_resources
            test "$(cat "$target_data/layouts/custom.json")" = "new destination layout"
            test -f "$legacy_data/layouts/custom.json"

            # Regression test: refuse writes through a symlinked parent directory.
            guard_root="$HOME/symlink-parent-guard"
            guard_real="$guard_root/real"
            guard_link="$guard_root/linked"
            mkdir -p "$guard_real"
            ln -s "$guard_real" "$guard_link"
            if ( source tools/portable/common.sh; assert_no_symlink_components "$guard_link/new-file" ); then
              echo "Symlinked parent path was unexpectedly accepted." >&2
              exit 1
            fi
            test ! -e "$guard_real/new-file"

            # Regression test: a migration with no destination copies and retains the source.
            migration_prefix_copy="$HOME/migration-copy/.local"
            migration_data_copy="$HOME/migration-copy/xdg"
            legacy_desktop_copy="$migration_prefix_copy/share/applications/openbangla-keyboard.desktop"
            destination_desktop_copy="$migration_data_copy/applications/openbangla-keyboard.desktop"
            mkdir -p "$(dirname "$legacy_desktop_copy")"
            printf "%s\n" "legacy desktop resource" > "$legacy_desktop_copy"
            OBK_PREFIX="$migration_prefix_copy"
            OBK_DATA_HOME="$migration_data_copy"
            migrate_legacy_xdg_resources
            test -f "$legacy_desktop_copy"
            test -f "$destination_desktop_copy"
            test "$(cat "$legacy_desktop_copy")" = "legacy desktop resource"
            test "$(cat "$destination_desktop_copy")" = "legacy desktop resource"

            # Regression test: replaced application databases have a recoverable backup.
            database_root="$HOME/database-backup-test"
            database_data="$database_root/xdg"
            database_source="$database_root/source"
            database_destination="$database_data/openbangla-keyboard"
            mkdir -p "$database_source/data" "$database_destination/data"
            printf "%s\n" "custom dictionary entries" > "$database_destination/data/dictionary.json"
            printf "%s\n" "new shipped dictionary" > "$database_source/data/dictionary.json"
            OBK_DATA_HOME="$database_data"
            merge_openbangla_data "$database_source" "$database_destination"
            test "$(cat "$database_destination/data/dictionary.json")" = "new shipped dictionary"
            dictionary_backup="$(find "$database_data/.openbangla-keyboard-backups" -type f -name dictionary.json -print -quit)"
            test -n "$dictionary_backup"
            test "$(cat "$dictionary_backup")" = "custom dictionary entries"
          '

      - name: Verify uninstall deletion allowlist
        run: |
          set -Eeuo pipefail
          test_home="$(mktemp -d)"
          mkdir -p "$test_home/.local/unrelated"
          printf '%s\n' 'keep this file' > "$test_home/.local/unrelated/valuable.txt"
          if HOME="$test_home" bash -c 'source tools/uninstall.sh; remove_path "$PREFIX/unrelated"'; then
            echo "Uninstaller unexpectedly accepted a non-OpenBangla path." >&2
            exit 1
          fi
          test -f "$test_home/.local/unrelated/valuable.txt"
          test "$(cat "$test_home/.local/unrelated/valuable.txt")" = 'keep this file'
          HOME="$test_home" bash -c 'source tools/uninstall.sh; is_allowed_openbangla_target "$PREFIX/lib/openbangla"'
          if HOME="$test_home" bash -c 'source tools/uninstall.sh; is_allowed_openbangla_target "$PREFIX/lib/vendor/nested/fcitx5/openbangla.so"'; then
            echo "Uninstaller unexpectedly accepted a deeply nested lookalike Fcitx module." >&2
            exit 1
          fi
          HOME="$test_home" bash -c 'source tools/uninstall.sh; is_allowed_openbangla_target "$PREFIX/lib/x86_64-linux-gnu/fcitx5/openbangla.so"'

          # Recursive removal must remove only the named tree, not follow child symlinks.
          outside="$test_home/outside"
          bundle="$test_home/.local/lib/openbangla"
          mkdir -p "$outside" "$bundle"
          printf '%s\n' 'outside data must survive' > "$outside/keep.txt"
          printf '%s\n' 'bundle file' > "$bundle/bundle.txt"
          ln -s "$outside/keep.txt" "$bundle/external-link"
          HOME="$test_home" bash -c 'source tools/uninstall.sh; remove_path "$PREFIX/lib/openbangla"'
          test ! -e "$bundle"
          test -f "$outside/keep.txt"
          test "$(cat "$outside/keep.txt")" = 'outside data must survive'

          # Simulate a nested mount point and verify that recursive removal fails closed.
          mount_tree="$test_home/.local/lib/openbangla"
          mkdir -p "$mount_tree/nested"
          mock_bin="$test_home/mock-bin"
          mkdir -p "$mock_bin"
          cat > "$mock_bin/mountpoint" <<'MOCK'
          #!/usr/bin/env bash
          for arg in "$@"; do target="$arg"; done
          [[ "${target:-}" == "${MOCK_MOUNT_POINT:?}" ]]
          MOCK
          chmod +x "$mock_bin/mountpoint"
          if MOCK_BIN="$mock_bin" MOCK_MOUNT_POINT="$mount_tree/nested" HOME="$test_home" bash -c 'source tools/uninstall.sh; PATH="$MOCK_BIN:$PATH"; remove_path "$PREFIX/lib/openbangla"'; then
            echo "Uninstaller unexpectedly removed a tree containing a mount point." >&2
            exit 1
          fi
          test -d "$mount_tree/nested"
          echo "Uninstaller refused recursive removal across a mount boundary."
          echo "Uninstaller removed only the named tree and left symlink targets untouched."

      - name: Upload prebuilt package
        uses: actions/upload-artifact@v5
        with:
          name: linux-${{ matrix.arch }}-${{ matrix.backend }}-package
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
