app-id: io.github.hasanmuammar.Shanti
runtime: org.kde.Platform
runtime-version: '5.15-25.08'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: openbangla-gui
separate-locales: false

# The GUI writes its layout and tweak settings here.
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-config/OpenBangla:create
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: openbangla-keyboard
    buildsystem: cmake-ninja
    builddir: true
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      build-args:
        - --share=network
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DBIN_DIR=/app/bin
      - -DDATADIR=/app/share
      - -DLIBEXECDIR=/app/libexec
      - -DENABLE_IBUS=ON
      - -DENABLE_FCITX=OFF
    post-install:
      - install -Dm644 /app/share/applications/openbangla-keyboard.desktop /app/share/applications/io.github.hasanmuammar.Shanti.desktop
      - sed -i 's/^Name=OpenBangla Keyboard$/Name=OpenBangla Keyboard Shanti/; s/^Icon=openbangla-keyboard$/Icon=io.github.hasanmuammar.Shanti/' /app/share/applications/io.github.hasanmuammar.Shanti.desktop
      - rm /app/share/applications/openbangla-keyboard.desktop
      - install -Dm644 /app/share/icons/hicolor/16x16/apps/openbangla-keyboard.png /app/share/icons/hicolor/16x16/apps/io.github.hasanmuammar.Shanti.png
      - install -Dm644 /app/share/icons/hicolor/32x32/apps/openbangla-keyboard.png /app/share/icons/hicolor/32x32/apps/io.github.hasanmuammar.Shanti.png
      - install -Dm644 /app/share/icons/hicolor/48x48/apps/openbangla-keyboard.png /app/share/icons/hicolor/48x48/apps/io.github.hasanmuammar.Shanti.png
      - install -Dm644 /app/share/icons/hicolor/128x128/apps/openbangla-keyboard.png /app/share/icons/hicolor/128x128/apps/io.github.hasanmuammar.Shanti.png
      - install -Dm644 /app/share/icons/hicolor/512x512/apps/openbangla-keyboard.png /app/share/icons/hicolor/512x512/apps/io.github.hasanmuammar.Shanti.png
      - install -Dm644 /app/share/metainfo/io.github.openbangla.keyboard.metainfo.xml /app/share/metainfo/io.github.hasanmuammar.Shanti.metainfo.xml
      - sed -i 's#<id>io.github.openbangla.keyboard</id>#<id>io.github.hasanmuammar.Shanti</id>#; s#<name>OpenBangla Keyboard</name>#<name>OpenBangla Keyboard Shanti</name>#; s#https://github.com/hasanmuammar/OpenBangla-Keyboard#https://github.com/hasanmuammar/OpenBangla-Keyboard-Shanti#g; s#https://raw.githubusercontent.com/hasanmuammar/OpenBangla-Keyboard/#https://raw.githubusercontent.com/hasanmuammar/OpenBangla-Keyboard-Shanti/#g' /app/share/metainfo/io.github.hasanmuammar.Shanti.metainfo.xml
      - rm /app/share/metainfo/io.github.openbangla.keyboard.metainfo.xml
    sources:
      - type: dir
        path: ../..
