app-id: org.shanti.ShantiIbus
runtime: org.kde.Platform
runtime-version: '5.15-25.08'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: shanti-gui
separate-locales: false

# IBus engine Flatpak. The Fcitx5 engine ships separately as the
# org.fcitx.Fcitx5.Addon.Shanti extension (Flatpak requires Fcitx5 addons
# to live under Flathub's org.fcitx.Fcitx5.Addon.* extension point).
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Settings store and user data for the rebranded layout.
  - --filesystem=xdg-config/Shanti:create
  - --filesystem=xdg-data/shanti-keyboard:create
  # Pre-rebrand locations, read for the one-time legacy migration.
  - --filesystem=xdg-config/OpenBangla:create
  - --filesystem=xdg-data/openbangla-keyboard:create
  - --filesystem=xdg-data/ibus/component:create
  - --filesystem=xdg-data/shanti-ibus:create
  - --filesystem=xdg-config/systemd/user/org.freedesktop.IBus.session.GNOME.service.d:create
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.systemd1

modules:
  - name: shanti-keyboard
    buildsystem: cmake-ninja
    builddir: true
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      build-args:
        - --share=network
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DBIN_DIR=/app/bin
      - -DDATADIR=/app/share
      - -DLIBEXECDIR=/app/libexec
      - -DENABLE_IBUS=ON
      - -DENABLE_FCITX=OFF
    post-install:
      - install -Dm644 /app/share/applications/shanti-keyboard.desktop /app/share/applications/org.shanti.ShantiIbus.desktop
      - sed -i 's/^Name=Shanti Keyboard$/Name=Shanti Keyboard (IBus)/; s/^Icon=shanti-keyboard$/Icon=org.shanti.ShantiIbus/' /app/share/applications/org.shanti.ShantiIbus.desktop
      - rm /app/share/applications/shanti-keyboard.desktop
      - install -Dm644 /app/share/icons/hicolor/16x16/apps/shanti-keyboard.png /app/share/icons/hicolor/16x16/apps/org.shanti.ShantiIbus.png
      - install -Dm644 /app/share/icons/hicolor/32x32/apps/shanti-keyboard.png /app/share/icons/hicolor/32x32/apps/org.shanti.ShantiIbus.png
      - install -Dm644 /app/share/icons/hicolor/48x48/apps/shanti-keyboard.png /app/share/icons/hicolor/48x48/apps/org.shanti.ShantiIbus.png
      - install -Dm644 /app/share/icons/hicolor/128x128/apps/shanti-keyboard.png /app/share/icons/hicolor/128x128/apps/org.shanti.ShantiIbus.png
      - install -Dm644 /app/share/icons/hicolor/512x512/apps/shanti-keyboard.png /app/share/icons/hicolor/512x512/apps/org.shanti.ShantiIbus.png
      - install -Dm644 /app/share/metainfo/org.shanti.ShantiKeyboard.metainfo.xml /app/share/metainfo/org.shanti.ShantiIbus.metainfo.xml
      - sed -i 's#<id>org.shanti.ShantiKeyboard</id>#<id>org.shanti.ShantiIbus</id>#; s#<name>Shanti Keyboard</name>#<name>Shanti Keyboard (IBus)</name>#; s#<icon type="remote"[^>]*>[^<]*</icon>#<icon type="stock">org.shanti.ShantiIbus</icon>#' /app/share/metainfo/org.shanti.ShantiIbus.metainfo.xml
      - rm /app/share/metainfo/org.shanti.ShantiKeyboard.metainfo.xml
    sources:
      - type: dir
        path: ../..
